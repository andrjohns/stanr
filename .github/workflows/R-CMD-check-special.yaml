on:
  push:
    branches: main
  pull_request:
    branches: main

name: R-CMD-check-special

jobs:
  sanitizers-and-valgrind:
    runs-on: ubuntu-latest
    name: ${{ matrix.config.name }}
    container:
      image: ghcr.io/r-hub/containers/${{ matrix.config.name }}:latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: "clang-asan" }
          - { name: "clang-ubsan" }
          - { name: "gcc-asan" }
          - { name: "valgrind" }
        # Fork PRs cannot access the Red Hat registration secrets. Keep the
        # RHEL job on main and same-repository PRs, where it can actually run.
        include: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && '[]' || '[{"config":{"name":"rhel9"}}]') }}

    env:
      MAKEFLAGS: -j1
      # Four parallel test processes can exhaust the hosted runner once ASan
      # instruments the vendored Stanli runtime. Keep full test coverage while
      # running the ASan suites one process at a time.
      TESTTHAT_CPUS: ${{ endsWith(matrix.config.name, '-asan') && '1' || '4' }}
      STANR_USE_QUICKJSR: true
      # oneTBB is deliberately built without ASan (src/Makevars.tbb), while
      # R and package code are instrumented. Mixed instrumentation can poison
      # vector capacity and report a false container-overflow in oneTBB's
      # internalPoolFree; keep all other AddressSanitizer checks enabled.
      ASAN_OPTIONS: ${{ endsWith(matrix.config.name, '-asan') && 'detect_leaks=0:alloc_dealloc_mismatch=0:detect_container_overflow=0' || '' }}
    steps:
      - uses: r-hub/actions/register-redhat@main
        if: matrix.config.name == 'rhel9'
        env:
          REDHAT_ORG: ${{ secrets.REDHAT_ORG }}
          REDHAT_KEY: ${{ secrets.REDHAT_KEY }}

      - name: install git & qpdf for rhel9
        if: matrix.config.name == 'rhel9'
        run: |
          subscription-manager repos --enable codeready-builder-for-rhel-9-$(arch)-rpms
          dnf install https://dl.fedoraproject.org/pub/epel/epel-release-latest-9.noarch.rpm -y
          yum --enablerepo=epel install -y git qpdf

      - uses: r-hub/actions/checkout@main
      - uses: r-hub/actions/platform-info@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          job-config: ${{ toJson(matrix.config) }}
      - uses: r-hub/actions/setup-deps@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          job-config: ${{ toJson(matrix.config) }}
      - uses: r-hub/actions/run-check@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          job-config: ${{ toJson(matrix.config) }}
