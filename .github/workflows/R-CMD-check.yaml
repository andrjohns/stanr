# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: main
  pull_request:
    branches: main

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os == 'wasm' && 'ubuntu-latest' || matrix.config.os }}
    container: ${{ matrix.config.os == 'wasm' && 'ghcr.io/r-universe-org/build-wasm' || '' }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: wasm, r: 'release'}

          - {os: macos-latest,   r: 'devel'}
          - {os: macos-latest,   r: 'release'}
          - {os: macos-latest,   r: 'oldrel'}

          - {os: windows-11-arm, r: 'release'}
          - {os: windows-latest, r: 'devel'}
          - {os: windows-latest, r: 'release'}
          - {os: windows-latest, r: 'oldrel'}

          - {os: ubuntu-24.04-arm,   r: 'devel'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel'}
          - {os: ubuntu-latest,   r: '4.3'}
          - {os: ubuntu-latest,   r: '4.2'}
          - {os: ubuntu-latest,   r: '4.1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      MAKEFLAGS: -j4
      TESTTHAT_CPUS: 4

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck ${{ matrix.config.os == 'wasm' && 'github::r-wasm/rwasm' || '' }}
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        if: matrix.config.os != 'wasm'
        with:
          upload-results: true
          check-dir: '"check"'

      - name: Build WASM package
        if: matrix.config.os == 'wasm'
        run: |
          rwasm::build("local::.", out_dir = ".")
        shell: Rscript {0}

      - uses: actions/setup-node@v7
        if: matrix.config.os == 'wasm'
        with:
          node-version: '22'

      - name: Install webR test harness dependencies
        if: matrix.config.os == 'wasm'
        working-directory: tools/webr-test
        run: npm ci

      - name: Run stanli-backend tests under webR (Node)
        if: matrix.config.os == 'wasm'
        run: |
          node tools/webr-test/run-stanli-tests.mjs \
            ./stanr_*.tgz . stanli-backend
